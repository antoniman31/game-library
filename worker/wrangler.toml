name = "game-library-proxy"
main = "index.js"
compatibility_date = "2026-01-01"

# L'identifiant de compte n'est pas un secret : il figure dans l'URL du tableau
# de bord Cloudflare et sert seulement à désigner le compte cible. Le jeton
# d'API, lui, vit dans les secrets GitHub et nulle part ailleurs.
account_id = "6b0e920b47a3ff6e9b19486f9ed43df0"

# Aucune clé d'API n'est stockée ici : les clés des services externes sont
# fournies par le client à chaque requête, et le code de synchronisation ne
# quitte pas l'appareil de son propriétaire (seule son empreinte SHA-256 sert
# de clé de stockage).

# Sauvegarde de la bibliothèque.
[[kv_namespaces]]
binding = "SYNC"
id = "f973a16a432a40e085b681d9aa3e88ba"
