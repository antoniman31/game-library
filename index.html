<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Game Library</title>
    <meta name="description" content="Bibliothèque de jeux vidéo : suivi de progression, temps de jeu, prêts et statistiques." />
    <!-- Valeur de départ, remplacée par le script plus bas dès que le thème
         enregistré est connu. Le bleu de l'accent coiffait une application
         noire le temps du chargement. -->
    <meta name="theme-color" content="#000000" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Game Library" />

    <!-- Les polices ne sont plus ici. Elles ont d'abord été un @import injecté
         par React au moment du rendu — la requête ne partait qu'une fois
         l'application montée, et le texte sautait de la police système à Inter
         — puis ce lien vers Google Fonts, qui réglait le moment mais pas la
         dépendance : il fallait toujours le réseau pour afficher du texte.
         Elles sont maintenant embarquées dans le build (voir src/index.css),
         donc présentes dans le paquet du site comme dans l'APK. -->

    <!-- Le thème est appliqué avant le premier rendu : posé par React dans un
         effet, l'app s'affichait un instant en sombre avant de basculer en clair.
         Ce script duplique volontairement resoudreTheme() de src/lib/apparence.js :
         il doit s'exécuter avant tout module, donc avant que le bundle existe.
         Trois valeurs possibles dans gl_theme — "auto" (ou rien), "light",
         "dark" — et l'automatique suit le réglage du téléphone. Le sombre est
         un noir profond ; la barre d'état du téléphone suit le fond, sinon le
         bleu du manifeste coiffe une application noire. -->
    <script>
      try {
        var t = localStorage.getItem("gl_theme");
        if (t !== "light" && t !== "dark") {
          t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.content = t === "light" ? "#dde6f8" : "#000000";
      } catch (e) { /* stockage indisponible : on reste sur le thème sombre */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
