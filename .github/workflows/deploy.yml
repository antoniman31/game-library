name: Vérification et déploiement

# Les vérifications tournent aussi sur les pull requests. Auparavant, le
# workflow ne se déclenchait que sur un push vers `main` : lint et build ne
# s'exécutaient donc qu'APRÈS la fusion, c'est-à-dire au moment où ils
# déploient déjà. Une pull request qui ne compile pas n'était visible qu'une
# fois le site cassé — c'est exactement ce qui s'est produit à la fusion de la
# #1, où `npm run lint` a fait échouer le déploiement cinq fois de suite.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Aucun secret n'est nécessaire : les clés API sont saisies par l'utilisateur dans
# l'application et stockées sur son appareil, jamais dans le dépôt ni dans le build.
permissions:
  contents: read
  pages: write
  id-token: write

# Un déploiement à la fois par référence : les pushes sur `main` restent
# sérialisés, sans qu'une pull request attende celle d'à côté.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verifier:
    name: Vérifier et construire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        # npm ci : le build est reproductible et échoue si le lockfile ne
        # correspond plus à package.json. `npm install` laissait au contraire
        # npm résoudre librement, donc une version mineure d'une dépendance
        # transitive pouvait casser un déploiement sans qu'aucun commit ne
        # touche au projet.
        #
        # Le lockfile porte désormais les binaires natifs Linux de Rollup, qui
        # manquaient quand il était généré sous Windows — c'était la cause de
        # l'échec de npm ci. Si tu installes sous Windows, npm y ajoutera les
        # binaires win32 : commite le lockfile mis à jour, il portera alors les
        # deux plateformes.
        run: npm ci --no-audit --no-fund

      - name: Vérifier le code
        run: npm run lint

      - name: Tests
        # Le Worker et les fonctions qui décident du sort de la bibliothèque :
        # migration jouée à chaque chargement, validation des imports,
        # rétrocompatibilité. C'est là qu'une régression mange des données.
        run: npm test

      - name: Construire le site
        run: npm run build

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # Le contrôle d'interface ne tournait qu'à la main (`npm run verif:ui`) : il ne protégeait que si quelqu'un pensait à le lancer.
  # Cibles tactiles de 48 px, contraste, focus et débordements, sur des pages réelles. Bloque le déploiement, comme chez Bricks.
  # Règle commune « CI, trois niveaux » (16/11/2026) : une PR qui ne touche que des .md n'a rien à donner aux contrôles
  # lourds, qui sont alors marqués « sautés » (un job sauté compte comme réussi pour les contrôles obligatoires).
  # Sur main et au lancement manuel, tout tourne toujours.
  changements:
    name: Fichiers touchés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.tri.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: tri
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Le commit de fusion d'une PR a pour premier parent la pointe de main : leur écart est exactement la PR.
          fichiers=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$fichiers"
          if printf '%s\n' "$fichiers" | grep -qvE '\.md$'; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"

  interface:
    name: Interface
    needs: changements
    if: needs.changements.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Installer le navigateur de test
        run: npx playwright install --with-deps --only-shell chromium

      - name: Vérifier l'interface
        run: npm run verif:ui

  deploy:
    name: Publier sur GitHub Pages
    # Une pull request se vérifie mais ne publie rien : elle n'a pas à écraser
    # le site en ligne avant d'avoir été relue.
    if: github.event_name != 'pull_request'
    needs: [verifier, interface]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1