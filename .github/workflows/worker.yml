name: Déploiement du Worker

# Le Worker se déployait à la main, depuis un PC, avec `npx wrangler deploy`.
# Résultat : le code de `/sync` a passé plusieurs heures dans le dépôt sans
# jamais atteindre la production, et l'oubli n'était visible nulle part. Il se
# déploie désormais tout seul dès que `worker/` change.
on:
  push:
    branches: [main]
    paths:
      - "worker/**"
      - ".github/workflows/worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-deploy
  cancel-in-progress: false

jobs:
  deployer:
    name: Tester puis déployer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      # Les tests d'abord : un Worker cassé en production coupe la
      # synchronisation ET le relais des jaquettes.
      - name: Tests
        run: npm test

      - name: Déployer
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
