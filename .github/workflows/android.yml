name: Application Android

# L'APK ne se construit pas à chaque push.
#
# Le site se déploie tout seul parce qu'il n'y a rien à décider : il y a une
# seule version en ligne, et c'est la dernière. Une application, non — elle
# s'installe à la main, et construire un APK que personne ne télécharge coûte
# cinq minutes de machine pour rien. Il se déclenche donc à la demande, ou sur
# une étiquette de version quand on voudra en garder une trace.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest

    # L'empreinte SHA-256 du certificat de signature. Ce n'est pas un secret :
    # c'est l'identité publique de la clé, celle qu'Android compare pour savoir
    # si un APK est une mise à jour du précédent ou une autre application. Les
    # deux étapes qui la vérifient lisent la même valeur.
    env:
      EMPREINTE_ATTENDUE: 289733c366177417b0881f5a290476b14f814a5c7d94ce3c28309ba6b16be08f

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le SDK Android est déjà sur le runner ; seul le JDK demande un choix.
      # Temurin 21, parce que c'est ce que réclame le greffon Android de
      # Gradle 8 utilisé par Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Les vérifications du dépôt tournent avant de fabriquer quoi que ce
      # soit : un APK qui embarque du code non testé n'a pas d'intérêt, et sa
      # panne se découvrirait sur le téléphone plutôt que dans la CI.
      - name: Vérifier
        run: |
          npm run lint
          npm test

      # `npm run android` enchaîne tout : la variante de build sans service
      # worker, les icônes engendrées depuis public/, le projet Android et la
      # synchronisation des greffons. Rien de ce qu'elle produit n'est dans le
      # dépôt — c'est la règle du projet, et c'est ce qui garantit que cette
      # construction part toujours des mêmes sources.
      - name: Fabriquer le projet Android
        run: npm run android

      # Toutes les constructions s'annonçaient comme la version 1.
      #
      # Capacitor engendre `versionCode 1` et ne le touche plus jamais. Android
      # s'en sert pour comparer deux APK, et le Play Store refuse un numéro qui
      # n'augmente pas : deux APK différents étaient donc, pour le système comme
      # pour qui les regarde, la même chose. Le numéro d'exécution du workflow
      # ne recule jamais et ne se répète pas — c'est exactement ce qu'on
      # demande à un `versionCode`.
      #
      # Le nom, lui, porte aussi le commit : c'est ce qui permet de remonter
      # d'un APK installé au code qui l'a produit. Il s'affiche dans ⚙️.
      #
      # Ajouté au projet engendré, pour la même raison que le bloc de signature
      # plus bas : `android/` n'entre pas dans le dépôt. Un second bloc
      # `defaultConfig` ne remplace pas le premier, il le complète — et la
      # dernière valeur écrite l'emporte.
      - name: Numéroter la construction
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle <<GRADLE

          // Ajouté par .github/workflows/android.yml, étape « Numéroter la
          // construction ». Sans cela, tous les APK s'appellent version 1.
          android {
              defaultConfig {
                  versionCode ${{ github.run_number }}
                  versionName "1.0.${{ github.run_number }}+${GITHUB_SHA:0:7}"
              }
          }
          GRADLE

      # Android n'identifie pas une application par son nom mais par la clé
      # qui l'a signée. Deux APK signés par deux clés différentes sont deux
      # applications étrangères l'une à l'autre : la seconde refuse de
      # s'installer par-dessus la première, et la seule issue est de
      # désinstaller — donc d'effacer la bibliothèque, qui ne vit nulle part
      # ailleurs sur l'appareil.
      #
      # Faute de clé, Gradle en fabrique une à la volée ; sur une machine de CI
      # neuve à chaque exécution, cela veut dire une clé neuve à chaque APK.
      #
      # La clé est déclarée explicitement plutôt que déposée dans
      # `~/.android/debug.keystore` en espérant que Gradle l'y trouve : essayé,
      # et l'APK est ressorti signé par autre chose. Cet emplacement implicite
      # se résout à partir de variables d'environnement propres à la machine ;
      # un chemin écrit noir sur blanc ne dépend de rien. Le bloc s'ajoute au
      # projet engendré par Capacitor, qui n'entre pas dans le dépôt — c'est
      # pourquoi il vit ici et non dans un fichier versionné.
      #
      # Le secret ne protège rien de plus que la clé de débogage standard, dont
      # les mots de passe sont publics : il évite seulement qu'un inconnu signe
      # un APK au nom de cette application. S'il manque, on s'arrête — sans
      # cela on retomberait sur une clé aléatoire, et la panne ne se
      # découvrirait qu'au moment de l'installation, sur le téléphone.
      - name: Poser la clé de signature
        env:
          CLE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret ANDROID_DEBUG_KEYSTORE est absent. Sans lui, Gradle signerait l'APK avec une clé aléatoire et la mise à jour serait refusée par le téléphone."
            exit 1
          fi

          magasin="$RUNNER_TEMP/signature.keystore"
          printf '%s' "$CLE" | base64 -d > "$magasin"

          # Le magasin est relu tout de suite : un secret tronqué au
          # copier-coller donnerait un fichier illisible, et la panne ne se
          # verrait qu'au bout de la chaîne. Autant l'apprendre ici, où le
          # message peut dire quoi corriger.
          empreinte=$(keytool -list -v -keystore "$magasin" -storepass android 2>/dev/null \
            | sed -n 's/.*SHA256: *//p' | head -1 | tr -d ':' | tr 'A-F' 'a-f')
          echo "Magasin : $(stat -c%s "$magasin") octets, empreinte ${empreinte:-illisible}"
          if [ "$empreinte" != "$EMPREINTE_ATTENDUE" ]; then
            echo "::error::Le magasin déposé n'est pas celui attendu (secret tronqué ou mal collé ?). Attendu $EMPREINTE_ATTENDUE, lu ${empreinte:-rien}."
            exit 1
          fi

          # `signingConfigs.debug` existe déjà, et `buildTypes.debug` s'en sert
          # déjà : ce bloc ne fait que lui donner la bonne clé.
          cat >> android/app/build.gradle <<GRADLE

          // Ajouté par .github/workflows/android.yml, étape « Poser la clé de
          // signature ». Sans cela, Gradle signerait avec une clé fabriquée à
          // la volée, différente à chaque construction, et l'APK ne pourrait
          // pas se poser par-dessus le précédent.
          android {
              signingConfigs {
                  debug {
                      storeFile file("$magasin")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
          }
          GRADLE

      # L'APK reste un APK de débogage : installable tel quel, aucune autre
      # configuration à écrire. Ce n'est PAS ce qu'il faudra pour le Play
      # Store, qui exige une version signée par une clé de publication et non
      # marquée `debuggable` — un APK de débogage laisse un appareil branché en
      # USB lire les données de l'application. Sur son propre téléphone, c'est
      # acceptable ; pour distribuer, non.
      - name: Construire l'APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Vérifier plutôt que supposer : si l'APK sortait signé par une autre clé
      # que celle qu'on vient de poser, il ne s'installerait pas par-dessus le
      # précédent et on ne l'apprendrait que sur le téléphone. L'empreinte
      # ci-dessous est publique — c'est l'identité de la clé, pas la clé.
      - name: Vérifier la signature
        run: |
          set -euo pipefail
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          obtenue=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          echo "Empreinte : $obtenue"
          if [ "$obtenue" != "$EMPREINTE_ATTENDUE" ]; then
            echo "::error::L'APK est signé par une autre clé que celle attendue ; il ne s'installerait pas par-dessus la version précédente."
            exit 1
          fi

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: game-library-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
