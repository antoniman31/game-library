name: Application Android

# L'APK ne se construit pas à chaque push.
#
# Le site se déploie tout seul parce qu'il n'y a rien à décider : il y a une
# seule version en ligne, et c'est la dernière. Une application, non — elle
# s'installe à la main, et construire un APK que personne ne télécharge coûte
# cinq minutes de machine pour rien. Il se déclenche donc à la demande, ou sur
# une étiquette de version quand on voudra en garder une trace.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Le SDK Android est déjà sur le runner ; seul le JDK demande un choix.
      # Temurin 21, parce que c'est ce que réclame le greffon Android de
      # Gradle 8 utilisé par Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      # Les vérifications du dépôt tournent avant de fabriquer quoi que ce
      # soit : un APK qui embarque du code non testé n'a pas d'intérêt, et sa
      # panne se découvrirait sur le téléphone plutôt que dans la CI.
      - name: Vérifier
        run: |
          npm run lint
          npm test

      # `npm run android` enchaîne tout : la variante de build sans service
      # worker, les icônes engendrées depuis public/, le projet Android et la
      # synchronisation des greffons. Rien de ce qu'elle produit n'est dans le
      # dépôt — c'est la règle du projet, et c'est ce qui garantit que cette
      # construction part toujours des mêmes sources.
      - name: Fabriquer le projet Android
        run: npm run android

      # Android n'identifie pas une application par son nom mais par la clé
      # qui l'a signée. Deux APK signés par deux clés différentes sont deux
      # applications étrangères l'une à l'autre : la seconde refuse de
      # s'installer par-dessus la première, et la seule issue est de
      # désinstaller — donc d'effacer la bibliothèque, qui ne vit nulle part
      # ailleurs sur l'appareil.
      #
      # Or Gradle, faute de clé de débogage, en fabrique une à la volée. Sur
      # une machine de CI neuve à chaque exécution, cela veut dire une clé
      # neuve à chaque APK. C'est ce qui s'est produit entre les deux premières
      # constructions, et ce que cette étape corrige : la clé est fixée une
      # fois pour toutes et déposée là où Gradle la cherche.
      #
      # Le secret ne protège rien de plus que la clé de débogage standard, dont
      # les mots de passe sont publics — il évite seulement qu'un inconnu signe
      # un APK au nom de cette application. S'il manque, on s'arrête : sans
      # cela on retomberait silencieusement sur une clé aléatoire, et la panne
      # ne se découvrirait qu'au moment de l'installation, sur le téléphone.
      - name: Poser la clé de signature
        env:
          CLE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Le secret ANDROID_DEBUG_KEYSTORE est absent. Sans lui, Gradle signerait l'APK avec une clé aléatoire et la mise à jour serait refusée par le téléphone."
            exit 1
          fi
          mkdir -p ~/.android
          printf '%s' "$CLE" | base64 -d > ~/.android/debug.keystore

      # L'APK reste un APK de débogage : installable tel quel, aucune autre
      # configuration à écrire. Ce n'est PAS ce qu'il faudra pour le Play
      # Store, qui exige une version signée par une clé de publication et non
      # marquée `debuggable` — un APK de débogage laisse un appareil branché en
      # USB lire les données de l'application. Sur son propre téléphone, c'est
      # acceptable ; pour distribuer, non.
      - name: Construire l'APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      # Vérifier plutôt que supposer : si l'APK sortait signé par une autre clé
      # que celle qu'on vient de poser, il ne s'installerait pas par-dessus le
      # précédent et on ne l'apprendrait que sur le téléphone. L'empreinte
      # ci-dessous est publique — c'est l'identité de la clé, pas la clé.
      - name: Vérifier la signature
        run: |
          set -euo pipefail
          attendue=289733c366177417b0881f5a290476b14f814a5c7d94ce3c28309ba6b16be08f
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          obtenue=$("$apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1)
          echo "Empreinte : $obtenue"
          if [ "$obtenue" != "$attendue" ]; then
            echo "::error::L'APK est signé par une autre clé que celle attendue ; il ne s'installerait pas par-dessus la version précédente."
            exit 1
          fi

      - name: Déposer l'APK
        uses: actions/upload-artifact@v4
        with:
          name: game-library-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
