# Mises à jour mensuelles, regroupées (une PR par écosystème) : chaque PR passe par la CI complète et attend le « go »
# d'Antoni, comme toutes les autres. Les actions sont épinglées par SHA ; Dependabot met à jour le SHA et le commentaire
# de version. Les correctifs de sécurité arrivent à part, dès qu'ils sortent (Settings → Code security).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      npm:
        patterns: ["*"]
